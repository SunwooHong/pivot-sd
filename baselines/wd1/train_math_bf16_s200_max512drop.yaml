# wd1++ MATH s200 (len256_200_g0) — bf16, max_prompt_length=512, drop, max_steps=1000.
use_peft: true
torch_dtype: bfloat16
load_in_4bit: false
model_path: GSAI-ML/LLaDA-8B-Instruct

attn_implementation: flash_attention_2

lora_r: 128
lora_alpha: 64
lora_dropout: 0.05
peft_task_type: CAUSAL_LM

dataset: math
seed: 42
bf16: true

sync_ref_model: True
ref_model_sync_steps: 64

adam_beta1: 0.9
adam_beta2: 0.99
weight_decay: 0.1
max_grad_norm: 0.2

use_vllm: false
vllm_device: auto
vllm_gpu_memory_utilization: 0.9

warmup_ratio: 0.0001
logging_steps: 1
learning_rate: 3e-6
lr_scheduler_type: constant_with_warmup

num_generations: 4
num_train_epochs: 10
max_steps: 1000

per_device_eval_batch_size: 2
per_device_train_batch_size: 2
gradient_accumulation_steps: 4

gradient_checkpointing: false
gradient_checkpointing_kwargs:
  use_reentrant: false

eval_strategy: "no"
do_eval: false
use_train_accuracy_callback: false

resume_from_checkpoint: false

trainer_type: wll_d1_neg
wandb_project: wd1pp_math_bf16_s200_max_512_drop
run_name: wd1pp_math_s200_bf16_max_512_drop
output_dir: checkpoints/wd1pp_math_s200_bf16_max_512_drop

save_steps: 100
save_strategy: steps
save_total_limit: 500
save_on_train_end: true

max_completion_length: 256
max_prompt_length: 512
block_length: 64
diffusion_steps: 256
generation_batch_size: 4
remasking: low_confidence
random_masking: True
p_mask_prompt: 0.15
beta: 0.04
epsilon: 0.5
num_iterations: 12
